<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Sara</title>
  <meta name="description" content="A little hello for Sara.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6f1;
      --bg-accent: #f6e3d6;
      --ink: #2a1f1a;
      --muted: #7a6a60;
      --accent: #d0563b;
      --card: #ffffff;
      --shadow: 0 20px 50px -20px rgba(80, 40, 20, 0.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17120f;
        --bg-accent: #2a1d16;
        --ink: #f5ece6;
        --muted: #b5a397;
        --accent: #ff8a6b;
        --card: #221a15;
        --shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background:
        radial-gradient(1200px 600px at 10% 10%, var(--bg-accent), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: clamp(32px, 6vw, 80px);
    }

    .greeting h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 800;
      font-size: clamp(64px, 13vw, 168px);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .greeting h1 .name { color: var(--accent); }

    .greeting p {
      margin: 20px 0 0;
      font-size: clamp(17px, 2vw, 20px);
      color: var(--muted);
    }

    .photo {
      margin: 0;
      width: 100%;
      max-width: 400px;
      justify-self: center;
      background: var(--card);
      border-radius: 20px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      transform: rotate(2deg);
    }

    .photo h2 {
      margin: 0 0 14px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(20px, 2.4vw, 26px);
    }

    .photo img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 62vh;
      aspect-ratio: 884 / 1160;
      object-fit: cover;
      border-radius: 12px;
      background: var(--bg-accent);
    }

    .photo figcaption {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .photo figcaption a { color: inherit; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; text-align: center; }
      .photo { transform: none; max-width: 420px; margin: 0 auto; text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <section class="greeting">
      <h1>Hi <span class="name">SARA</span></h1>
      <p>Someone made this page just for you.</p>
    </section>

    <figure class="photo">
      <h2>Here is a picture of him</h2>
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Shawn_Mendes_at_The_Queen%27s_Birthday_Party_%28cropped_2%29.jpg"
        alt="Shawn Mendes smiling on stage"
        width="884" height="1160">
      <figcaption>
        Shawn Mendes. Photo by Raph_PH,
        <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener">CC BY 2.0</a>,
        via <a href="https://commons.wikimedia.org/wiki/File:Shawn_Mendes_at_The_Queen%27s_Birthday_Party_(cropped_2).jpg" target="_blank" rel="noopener">Wikimedia Commons</a>.
      </figcaption>
    </figure>
  </main>
</body>
</html>
